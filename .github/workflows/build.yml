# Builds every host and pushes the closures to the niks3 binary cache.
#
# Cache pushes only happen on main: the niks3 OIDC provider binds both
# `repository` and `ref: refs/heads/main`, so a PR run cannot mint a write
# token. PR runs still build, just without the cache.
#
# Needs repo secret TS_AUTHKEY and an ACL rule allowing tag:ci -> tag:k8s:443.
# NIKS3_SERVER_URL is a repo variable holding https://niks3.<tailnet>.ts.net —
# hardcode it here instead if you'd rather.
#
# TS_AUTHKEY is an auth key, not an OAuth client, because the tailnet has tailnet
# lock enabled: an OAuth client mints an unsigned node key per job and there is
# no unattended way to sign it. The key must be reusable, ephemeral, tagged
# tag:ci, and pre-signed with `tailscale lock sign` from a signing node. It
# expires (90 days max), so it needs rotating — see README.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        host: [bajie, wukong, erlang]

    steps:
      - uses: actions/checkout@v5

      - name: Join tailnet
        if: github.ref == 'refs/heads/main'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: ${{ runner.temp }}/tailscale
          ping: niks3

      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.gibbo.tech
            extra-trusted-public-keys = nix-cache.gibbo.tech-1:+5Vna1yXB+Hkz9dbkjjirDr4usupVeS4fW1PAQQA0OI=

      # Registers a post-build-hook, so intermediate derivations are cached even
      # when the build below fails or is cancelled. Reads the substituter URL and
      # trusted public key from /api/cache-config.
      - name: Set up niks3 cache
        if: github.ref == 'refs/heads/main'
        uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ secrets.NIKS3_SERVER_URL }}

      - name: Build ${{ matrix.host }}
        run: |
          nix build --print-build-logs \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
